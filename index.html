<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Lexicon</title>
<style>
  :root {
    --bg: #fff;
    --fg: #111;
    --dim: #8a8a8a;
    --line: #e8e8e8;
    --bubble-a: #efefef;
    --bubble-b: #dbe9f7;
    --accent: #2f6ea5;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.6 -apple-system, "Hiragino Kaku Gothic ProN", system-ui, sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .shell { max-width: 640px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .side.right { justify-content: flex-end; }
  .side .name { font-weight: 600; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bubble-a); display: grid; place-items: center; font-size: 14px; flex: none; }
  .avatar.b { background: var(--bubble-b); }

  /* 会話 */
  #chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
  .notice:empty { display: none; }
  .notice { align-self: center; text-align: center; font-size: 12px; color: var(--dim); max-width: 440px; }
  .separator { align-self: stretch; display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--dim); letter-spacing: .04em; margin: 10px 0 2px; }
  .separator::before, .separator::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .row { display: flex; flex-direction: column; max-width: 78%; }
  .row.A { align-self: flex-start; align-items: flex-start; }
  .row.B { align-self: flex-end; align-items: flex-end; }
  .stamp { font-size: 11px; color: var(--dim); margin: 0 6px 4px; letter-spacing: .05em; }
  .bubble { border-radius: 20px; padding: 10px 14px; max-width: 100%; display: block; text-decoration: none; color: inherit; }
  a.bubble:hover { filter: brightness(.96); }
  .token { border-top: 1px solid var(--line); padding: 14px 0; }
  .token .piece { font-size: 18px; margin-bottom: 2px; }
  .token .label { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .token .piece a { text-decoration: none; border-bottom: 1px dotted var(--dim); }
  .token .piece a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .row.A .bubble { background: var(--bubble-a); border-bottom-left-radius: 6px; }
  .row.B .bubble { background: var(--bubble-b); border-bottom-right-radius: 6px; }
  .b64 { font-family: var(--mono); font-size: 12px; line-height: 1.55; word-break: break-all; max-height: 7.75em; overflow: hidden; }
  .b64.open { max-height: 60vh; overflow-y: auto; }
  /* 吹き出しが細くても「Show all」「See translation」が折り返さないよう、1行に保つ */
  .tools { display: flex; gap: 14px; font-size: 12px; color: var(--dim); margin: 5px 8px 0; white-space: nowrap; }
  @media (max-width: 360px) { .tools { gap: 10px; font-size: 11px; } }
  .tools button { text-decoration: underline; text-underline-offset: 3px; }
  .tools button:hover { color: var(--fg); }
  .translation { font-size: 14px; color: var(--fg); margin: 6px 8px 0; }
  .translation a { text-decoration: none; border-bottom: 1px dotted var(--dim); }
  .translation a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .typing .bubble { display: flex; gap: 4px; padding: 14px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* 辞書のページ */
  #page { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 60px; display: none; }
  body.paged #chat { display: none; }
  body.paged #page { display: block; }
  .back { font-size: 13px; color: var(--dim); text-decoration: none; display: inline-block; margin-bottom: 24px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  input[type=search] { width: 100%; background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid var(--line); font: inherit; padding: 8px 0; margin-bottom: 20px; outline: none; }
  .words { list-style: none; columns: 3 140px; column-gap: 24px; }
  .words li { break-inside: avoid; padding: 2px 0; }
  .words a { text-decoration: none; }
  .words a:hover { color: var(--accent); }
  .words .count { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .head { font-size: 44px; line-height: 1.2; margin-bottom: 6px; word-break: break-all; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 32px; }
  h2 { font-size: 12px; font-weight: normal; letter-spacing: .04em; color: var(--dim); margin: 32px 0 12px; }
  .form { border-top: 1px solid var(--line); padding: 14px 0; }
  .form .label { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .sentence { margin-bottom: 6px; }
  .translation-full .sentence { font-size: 22px; line-height: 1.5; margin-bottom: 8px; }
  .translation-full a { text-decoration: none; border-bottom: 1px dotted var(--dim); }
  .translation-full a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .sentence mark { background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .form .b64 { max-height: 6.2em; }
  .about p, .about li { margin-bottom: 10px; }
  .about ul { padding-left: 1.2em; }
  .about .note { color: var(--dim); }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="side"><div class="avatar">A</div><div class="name">A</div></div>
    <div class="side right"><div class="name">B</div><div class="avatar b">B</div></div>
  </div>

  <div id="chat">
    <div class="messages" id="messages">
      <div class="notice" id="notice"></div>
    </div>
  </div>

  <div id="page"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const e = document.createElement(tag);
    Object.assign(e, props);
    for (const c of children) e.append(c);
    return e;
  };
  const pad2 = n => String(n).padStart(2, "0");
  const fmtChars = n => n.toLocaleString("en-US");

  const POLL_MS = 1000;
  let timeline = null;   // data/timeline.json（全部の会話と発話）
  let lexicon = null;    // data/lexicon/index.json（辞書）
  let entryOf = {};      // 見出し語 → 項目ファイル
  const cache = {};

  async function fetchJSON(path, mode = "no-cache") {
    const r = await fetch(path, { cache: mode });
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return r.json();
  }
  async function loadJSON(path) {
    return cache[path] || (cache[path] = await fetchJSON(path));
  }
  async function refreshLexicon() {
    try {
      const now = await fetchJSON("data/lexicon/index.json", "no-store");
      if (!lexicon || JSON.stringify(now.meta.runs) !== JSON.stringify(lexicon.meta.runs)) {
        lexicon = now;
        entryOf = Object.fromEntries(now.entries.map(e => [e.key, e.file]));
        for (const k of Object.keys(cache)) if (k.startsWith("data/lexicon/")) delete cache[k];
      }
    } catch {}
    return lexicon;
  }
  const convIndex = run => timeline ? timeline.conversations.findIndex(c => c.run === run) : -1;
  const convLabel = run => {
    const i = convIndex(run);
    const c = timeline && timeline.conversations[i];
    // 画面には日付を出さない（ユーザーの希望）。会話は番号だけで呼ぶ
    return c ? `Conversation ${i + 1}` : "Conversation";
  };

  // トークンの並びを、辞書に載っている語はリンクにして描く（辞書は会話が終わるたびに作り直されるので、その時点の辞書で引く）
  function linkedTokens(container, pieces, mark = -1) {
    pieces.forEach((p, k) => {
      const file = entryOf[p.trim().toLowerCase()];
      let node = file ? el("a", { href: `#/w/${file}`, textContent: p }) : document.createTextNode(p);
      if (k === mark) node = el("mark", {}, node);
      container.append(node);
    });
    return container;
  }

  // ---- 会話 ----
  const box = $("messages");
  const rendered = new Set();   // "run/turn"
  let typingRow = null;
  const nearBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  const toBottom = () => { box.scrollTop = box.scrollHeight; };

  function messageRow(conv, t) {
    const b64 = el("div", { className: "b64", textContent: t.preview });
    const full = el("button", { textContent: `Show all (${fmtChars(t.chars)} chars)` });
    full.onclick = async () => {
      if (b64.classList.contains("open")) {
        b64.classList.remove("open");
        b64.textContent = t.preview;
        full.textContent = `Show all (${fmtChars(t.chars)} chars)`;
        return;
      }
      const data = await loadJSON(`data/${t.file}`);
      b64.textContent = data.b64;
      b64.classList.add("open");
      full.textContent = "Show less";
    };
    const tr = el("div", { className: "translation", hidden: true });
    const trBtn = el("button", { textContent: "See translation" });
    trBtn.onclick = () => {
      if (tr.hidden) {
        tr.replaceChildren();
        if (t.pieces.length) linkedTokens(tr, t.pieces); else tr.textContent = t.text;
      }
      tr.hidden = !tr.hidden;
      trBtn.textContent = tr.hidden ? "See translation" : "Hide translation";
    };
    return el("div", { className: `row ${t.speaker}` },
      el("div", { className: "stamp", textContent: `${t.speaker} ・ TURN ${pad2(t.turn)} ・ ${t.n_tokens} vectors` }),
      el("a", { className: "bubble", href: `#/t/${conv.run}/t${pad2(t.turn)}`, title: "Open this message" }, b64),
      el("div", { className: "tools" }, full, trBtn),
      tr);
  }

  function setTyping(speaker) {
    if (typingRow && typingRow.dataset.speaker === speaker) { box.append(typingRow); return; }
    if (typingRow) typingRow.remove();
    typingRow = null;
    if (!speaker) return;
    typingRow = el("div", { className: `row ${speaker} typing` }, el("div", { className: "bubble" }, el("i"), el("i"), el("i")));
    typingRow.dataset.speaker = speaker;
    box.append(typingRow);
  }

  // ---- 展示の放送 ----
  // data/broadcast.json があれば、展示の格子ビューアと同じ時計で発話を届ける（毎日の開場時刻を起点に全会話を順に流す）。
  // その周ですでに流し終わった発話だけを出し、流している発話の間は話し手の「入力中」を出す。?all=1 で全部を出す
  let broadcast = null, lastPos = null, timelineAt = 0;
  const useBroadcast = !new URLSearchParams(location.search).has("all");
  function broadcastPos(b) {
    const off = b.utc_offset_minutes * 60000, day = 86400000, now = Date.now();
    const [h, m] = b.start.split(":").map(Number);
    let anchor = Math.floor((now + off) / day) * day + (h * 60 + m) * 60000 - off;
    if (now < anchor) anchor -= day;   // 開場時刻より前は、前日の起点からの続き
    return ((now - anchor) / 1000) % b.cycle;
  }
  async function loadBroadcast() {
    if (!useBroadcast || broadcast !== null) return;
    try { broadcast = await fetchJSON("data/broadcast.json", "no-store"); } catch { broadcast = false; }
  }
  // 放送中なら、会話ごと・発話ごとに「出してよいか」と、今「入力中」の話し手を返す
  function broadcastView() {
    if (!broadcast) return null;
    const pos = broadcastPos(broadcast);
    const shown = new Set(), started = new Set();
    let typing = null;
    for (const [ci, turn, speaker, , start, end] of broadcast.turns) {
      const run = broadcast.runs[ci];
      if (end <= pos) { shown.add(`${run}/${turn}`); started.add(run); }
      else if (start <= pos) { typing = speaker; started.add(run); }
    }
    return { pos, shown, started, typing };
  }

  // timeline を読み、まだ出していない会話の区切りと発話を下に足す。生成中の会話があれば、次に話す側に「入力中」を出す
  async function syncChat() {
    // 放送中は会話の中身が変わらないので、timeline は1分に1回だけ読み直す（時計に合わせた表示は毎秒）
    if (!timeline || !broadcast || Date.now() - timelineAt > 60000) {
      timeline = await fetchJSON("data/timeline.json", "no-store");
      timelineAt = Date.now();
    }
    await loadBroadcast();
    const bv = broadcastView();
    if (bv && lastPos !== null && bv.pos < lastPos - 1) {
      // 放送が一周して頭に戻った: 画面を空にして最初から
      box.querySelectorAll(".separator, .row").forEach(n => n.remove());
      rendered.clear();
      typingRow = null;
    }
    if (bv) lastPos = bv.pos;
    const stick = rendered.size === 0 || nearBottom();
    let live = null;
    for (const conv of timeline.conversations) {
      if (bv && !bv.started.has(conv.run)) continue;
      const sepKey = `${conv.run}/sep`;
      if (!rendered.has(sepKey) && (conv.turns.length || conv.status === "live")) {
        if (typingRow) typingRow.remove();
        box.append(el("div", { className: "separator", textContent: convLabel(conv.run) }));
        rendered.add(sepKey);
      }
      for (const t of conv.turns) {
        const key = `${conv.run}/${t.turn}`;
        if (rendered.has(key) || (bv && !bv.shown.has(key))) continue;
        if (typingRow) typingRow.remove();
        box.append(messageRow(conv, t));
        rendered.add(key);
      }
      if (conv.status === "live") live = conv;
    }
    if (bv) {
      setTyping(bv.typing);
    } else if (live) {
      const last = live.turns[live.turns.length - 1];
      setTyping(!last ? "A" : last.speaker === "A" ? "B" : "A");
    } else {
      setTyping(null);
    }
    if (stick) toBottom();
  }

  // ---- 辞書・発話のページ ----
  const page = $("page");
  const backLink = () => el("a", { className: "back", href: "#/", textContent: "← Back to chat" });

  function b64Form(label, b64, sentence) {
    const block = el("div", { className: "b64", textContent: b64 });
    const toggle = el("button", { textContent: `Show all (${fmtChars(b64.length)} chars)` });
    toggle.onclick = () => {
      block.classList.toggle("open");
      toggle.textContent = block.classList.contains("open") ? "Show less" : `Show all (${fmtChars(b64.length)} chars)`;
    };
    const form = el("div", { className: "form" });
    if (label) form.append(el("div", { className: "label", textContent: label }));
    if (sentence) form.append(sentence);
    form.append(block, el("div", { className: "tools" }, toggle));
    return form;
  }

  async function renderWords() {
    const { meta, entries } = await refreshLexicon();
    const search = el("input", { type: "search", placeholder: "見出し語を探す" });
    const list = el("ul", { className: "words" });
    const draw = () => {
      const q = search.value.trim().toLowerCase();
      list.replaceChildren(...entries.filter(e => e.key.includes(q)).map(e =>
        el("li", {}, el("a", { href: `#/w/${e.file}`, textContent: e.key }), el("span", { className: "count", textContent: e.count }))));
    };
    search.oninput = draw;
    draw();
    const total = entries.reduce((s, e) => s + e.count, 0);
    page.replaceChildren(backLink(),
      el("p", { className: "meta", textContent: `${entries.length} 見出し語 ・ ${total} 用例 ・ ${meta.model} 同士の ${meta.runs.length} 会話・${meta.turns} 発話から` }),
      search, list);
  }

  async function renderEntry(file) {
    await refreshLexicon();
    const e = await loadJSON(`data/lexicon/entries/${file}`);
    const s = e.similarity;
    const sim = s
      ? `発話形どうしの似ている度合い（コサイン類似度）: 最小 ${s.min.toFixed(3)} ・ 平均 ${s.mean.toFixed(3)} ・ 最大 ${s.max.toFixed(3)}（${s.pairs} 組` +
        (s.sampled ? `。用例が多いため、最初の ${s.sample_size} 個どうしで計算` : "") + "）。" +
        (e.duplicates
          ? `${e.duplicates} 個の用例は、前後の文脈がまったく同じだったため、ほかの用例と完全に同じ綴りになっている。`
          : "完全に同じ綴りは1つもない。")
      : "会話で使われたのは1回だけ。";
    const forms = e.forms.map(f => b64Form(`トークン ID ${f.id}「${f.piece}」の入力埋め込み（文脈に依存しない）`, f.b64));
    const uses = e.occurrences.map((o, i) => {
      const sentence = linkedTokens(el("div", { className: "sentence" }), o.tokens, o.pos);
      return b64Form(`用例 ${i + 1} ・ ${convLabel(o.run)} ・ ${o.speaker} の発話（TURN ${pad2(o.turn)}）の ${o.pos + 1} 番目のトークン`, o.b64, sentence);
    });
    page.replaceChildren(backLink(),
      el("div", { className: "head", textContent: e.key }),
      el("div", { className: "sub", textContent: `辞書形 ${e.forms.length} ・ 発話形 ${e.occurrences.length}` }),
      el("h2", { textContent: "辞書形" }), ...forms,
      el("h2", { textContent: "発話形" }), el("p", { className: "meta", textContent: sim }), ...uses);
    page.scrollTop = 0;
  }

  // Base64 をバイトに戻し、1トークン分（n_embd 個の float32）ずつ切り出して Base64 にし直す
  function tokenB64s(b64, nTokens, nEmbd) {
    const bin = atob(b64);
    const per = nEmbd * 4;
    const out = [];
    for (let k = 0; k < nTokens; k++) out.push(btoa(bin.slice(k * per, (k + 1) * per)));
    return out;
  }

  async function renderTurn(run, name) {
    await refreshLexicon();
    const t = await loadJSON(`data/turns/${run}/${name}.json`);
    const conv = timeline && timeline.conversations[convIndex(run)];
    const nEmbd = conv ? conv.n_embd : 5120;
    const nTok = t.pieces.length || Math.round(atob(t.b64).length / (nEmbd * 4));
    const sentence = t.pieces.length ? linkedTokens(el("div", { className: "sentence" }), t.pieces) : el("div", { className: "sentence", textContent: t.text });
    const parts = tokenB64s(t.b64, nTok, nEmbd);
    const tokens = parts.map((part, k) => {
      const form = b64Form(`Vector ${k + 1} / ${nTok}`, part);
      if (t.pieces.length) form.insertBefore(linkedTokens(el("div", { className: "piece" }), [t.pieces[k]]), form.children[0]);
      form.className = "token";
      return form;
    });
    page.replaceChildren(backLink(),
      el("div", { className: "sub", textContent: `${convLabel(run)} ・ ${t.speaker} ・ TURN ${pad2(t.turn)} ・ ${nTok} vectors ・ layer ${conv ? conv.layer : ""}` }),
      el("div", { className: "translation-full" }, sentence),
      el("h2", { textContent: "Message" }), b64Form("", t.b64),
      el("h2", { textContent: "Vectors" }), ...tokens);
    page.scrollTop = 0;
  }

  async function renderAbout() {
    const { meta } = await refreshLexicon();
    const p = (text, cls = "") => el("p", { className: cls, textContent: text });
    const li = text => el("li", { textContent: text });
    page.replaceChildren(backLink(), el("div", { className: "about" },
      el("h2", { textContent: "何が起きているか（事実）" }),
      p(`${meta.model} の2つのエージェント A と B に、あらかじめ与えた問いについて英語で会話をさせている（これまでに ${meta.runs.length} 会話・${meta.turns} 発話）。2体は互いの言葉を一度も見ていない。相手に渡したのは、発話の各トークンを読んだときの ${meta.layer} 層の内部状態（${meta.n_embd} 個の float32）だけである。受け手はその数字を自分の ${meta.layer} 層に上書きされて、次の発話を作った。`),
      p("会話が生成されている間は、1発話ができるたびに吹き出しが届く。「入力中」の表示は、実際に次の発話を生成している間だけ出る。"),
      p("吹き出しの文字列は、渡した数字のバイト列（float32、リトルエンディアン）を、そのまま Base64 にしたもの。逆に変換すれば、1ビットも違わず元の数字に戻る。文字の形は変換方式で決まっており、AI がこの文字を選んだわけではない。"),
      p("「See translation」で出る英文は、各エージェントが内部で作っていた言葉（相手には渡していない）。"),
      el("h2", { textContent: "辞書" }),
      el("ul", {},
        li("見出し語は、会話に出てきたトークン（前後の空白を除き小文字にしたもの）。辞書は、会話が1つ終わるたびに、全部の会話から作り直される。"),
        li("辞書形: そのトークンがモデルに入るときの入力埋め込み。文脈に関係なく、トークンごとに1つに決まる。"),
        li(`発話形: 会話の中でそのトークンが使われたときに、実際に相手に渡した ${meta.layer} 層の状態。文脈が混ざるため、使われるたびに値が変わる。`),
        li("同じ単語の発話形は互いによく似ている（コサイン類似度 0.95〜0.99 程度）。前後の文脈が少しでも違えば値も変わり、数字のわずかな違いでもバイトは大きく変わるため、Base64 の見た目はほぼ全体が違う。"),
        li("逆に、前後の文脈がまったく同じ場合（たとえば、説明文を読んだ直後の会話の書き出しが同じ言葉だったとき）は、計算の結果も完全に同じ綴りになる。")),
      el("h2", { textContent: "解釈" }),
      p("これらの文字列は、AI が言葉を話す手前の内部状態を記録したものである。それを「AI の言葉」と呼ぶかどうかは、この作品の問いである。", "note")));
    page.scrollTop = 0;
  }

  function route() {
    const h = location.hash;
    const m = h.match(/^#\/w\/(e\d{4}\.json)$/);
    const mt = h.match(/^#\/t\/([\w.-]+)\/(t\d{2})$/);
    const paged = !!m || !!mt || h === "#/words" || h === "#/about";
    document.body.classList.toggle("paged", paged);
    if (!paged) return;
    const done = m ? renderEntry(m[1]) : mt ? renderTurn(mt[1], mt[2]) : h === "#/words" ? renderWords() : renderAbout();
    done.catch(() => page.replaceChildren(backLink(), el("p", { className: "meta", textContent: "データを読めませんでした" })));
  }

  async function tick() {
    try {
      await refreshLexicon();
      await syncChat();
      $("notice").textContent = "";
    } catch {
      if (!rendered.size) $("notice").textContent = "データを読めませんでした（tools/new_conversation.py を実行）";
    }
    setTimeout(tick, POLL_MS);
  }

  addEventListener("hashchange", route);
  refreshLexicon().then(route);
  tick();
</script>
</body>
</html>
